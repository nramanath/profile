name: CI - Code Quality & Build Check

on:
    pull_request:
        branches: [main]
    workflow_dispatch:

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Install dependencies
              uses: jdx/mise-action@v2
              with:
                  install: true
                  cache: true

            - name: Install Node dependencies
              run: mise run setup

            - name: Check formatting
              run: mise check-format

            - name: Run linter
              run: mise lint

            - name: Build with Astro
              run: mise build
